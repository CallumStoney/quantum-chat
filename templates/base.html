<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insightful Encryptions</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            /* Engineered utilitarian developer palette */
            --bg:          #0d1117;
            --bg-2:        #161b22;
            --bg-3:        #21262d;
            --bg-panel:    #161b22;

            --text:        #e6edf3;
            --text-hi:     #ffffff;
            --text-dim:    #8b949e;
            --text-md:     #8b949e;
            --text-faint:  #6e7681;
            --text-lo:     #484f58;

            --primary:     #1f6feb;
            --primary-hover:#388bfd;
            --blue:        #1f6feb;
            --blue-light:  #58a6ff;

            --cyan:        #58a6ff;
            --cyan-dim:    #1f6feb;
            --cyan-glow:   transparent;

            --amber:       #d29922;
            --amber-dim:   rgba(210,153,34,0.12);

            --rose:        #f85149;
            --rose-dim:    rgba(248,81,73,0.12);
            --red:         #f85149;

            --green:       #2ea043;
            --green-light: #3fb950;
            --jade:        #2ea043;
            --jade-dim:    #238636;

            --purple:      #8957e5;
            --purple-light:#a371f7;
            --violet:      #8957e5;
            --violet-dim:  rgba(137,87,229,0.12);

            --muted:       #6e7681;
            --muted-2:     #8b949e;

            --border:      #30363d;
            --border-md:   #484f58;
            --border-hi:   #58a6ff;

            --mono: 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;

            /* Crisp, utilitarian corners - no bubbly soft radii */
            --radius-sm: 2px;
            --radius-md: 3px;
            --radius-lg: 4px;
            --radius-xl: 4px;
            --rad-sm: 2px;
            --rad-md: 3px;
            --rad-lg: 4px;
        }

        html, body {
            margin: 0; padding: 0; height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 13px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Clean unobtrusive scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 1px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }

        /* Topbar */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 200;
            height: 48px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px;
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
        }

        .topbar-logo {
            display: flex; align-items: center; gap: 8px;
            text-decoration: none;
            color: var(--text-hi);
        }

        .logo-mark {
            width: 22px; height: 22px;
            border-radius: var(--radius-sm);
            background: var(--bg-3);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            color: var(--text-dim);
        }
        .logo-mark svg { display: block; }

        .logo-text {
            font-size: 13px; font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-hi);
            font-family: var(--sans);
        }

        .topbar-nav { display: flex; align-items: center; gap: 4px; }

        .topbar-link {
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px; font-weight: 500;
            color: var(--text-dim);
            text-decoration: none;
            transition: color 0.15s, background 0.15s;
        }
        .topbar-link:hover { color: var(--text-hi); background: var(--bg-3); }
        .topbar-link.active {
            color: var(--text-hi);
            background: var(--bg-3);
            border: 1px solid var(--border);
        }

        .btn-disconnect {
            padding: 5px 12px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
            font-size: 12px; font-weight: 600;
            border-radius: var(--radius-sm);
            text-decoration: none;
            transition: background 0.15s;
            font-family: var(--sans);
        }
        .btn-disconnect:hover {
            background: rgba(239,68,68,0.2);
        }

        /* Chat Layout */
        .chat-page {
            height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden; padding-top: 50px;
        }

        .chat-topbar-ext {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 18px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-2);
            flex-shrink: 0;
        }

        .room-badge {
            display: flex; align-items: center; gap: 8px;
        }

        .room-badge-live {
            display: inline-flex; align-items: center;
            font-family: var(--mono);
            font-size: 10px; font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--green-light);
            background: rgba(46,160,67,0.12);
            border: 1px solid rgba(46,160,67,0.3);
            border-radius: var(--radius-sm);
            padding: 2px 6px;
            text-transform: uppercase;
        }

        .room-code-display {
            font-family: var(--mono);
            font-size: 14px; font-weight: 700;
            color: var(--text-hi);
            letter-spacing: 0.15em;
            background: var(--bg-3);
            padding: 3px 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-md);
        }

        .btn-copy-room {
            background: var(--bg-3);
            border: 1px solid var(--border-md);
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-family: var(--sans);
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .btn-copy-room:hover {
            border-color: var(--border-hi);
            color: var(--text-hi);
        }

        .btn-close-guide:hover { color: var(--text-hi); }

        .chat-body {
            flex: 1; display: flex; min-height: 0; overflow: hidden;
        }

        /* Chat column */
        .chat-col {
            display: flex; flex-direction: column;
            width: 38%; min-width: 300px; max-width: 75%;
            overflow: hidden; flex-shrink: 0;
            background: var(--bg);
        }

        .room-quick-guide {
            background: var(--bg-2);
            border: 1px solid var(--border);
            margin: 12px 12px 0 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px; color: var(--text-dim);
            line-height: 1.5; flex-shrink: 0;
        }

        .chat-log {
            flex: 1; overflow-y: auto;
            padding: 14px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .chat-send-row {
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            display: flex; gap: 8px;
            flex-shrink: 0;
            background: var(--bg-2);
        }

        .chat-input {
            flex: 1; padding: 8px 12px;
            background: var(--bg-3);
            border: 1px solid var(--border-md);
            color: var(--text);
            font-size: 13px;
            border-radius: var(--radius-sm);
            font-family: var(--sans);
            outline: none; transition: border-color 0.15s;
        }
        .chat-input:focus {
            border-color: var(--border-hi);
        }
        .chat-input::placeholder { color: var(--text-faint); }

        #encryption-selector {
            padding: 7px 10px;
            background: var(--bg-3);
            border: 1px solid var(--border-md);
            color: var(--text);
            font-size: 12px;
            border-radius: var(--radius-sm);
            outline: none; cursor: pointer;
            font-family: var(--sans);
            transition: border-color 0.15s;
        }
        #encryption-selector:focus { border-color: var(--border-hi); }
        #encryption-selector option { background: var(--bg-2); }

        #host-force-cipher {
            padding: 6px 8px;
            background: var(--bg-3);
            border: 1px solid var(--border-md);
            color: var(--text);
            font-size: 12px;
            border-radius: var(--radius-sm);
            outline: none; cursor: pointer;
            transition: border-color 0.15s;
            font-family: inherit;
            flex: 1;
            min-width: 140px;
        }
        #host-force-cipher:focus { border-color: var(--border-hi); }
        #host-force-cipher option { background: var(--bg-2); }

        #affine-a, #affine-b {
            background: var(--bg-3);
            border: 1px solid var(--border-md);
            color: var(--text);
            font-size: 12px;
            border-radius: var(--radius-sm);
            outline: none; cursor: pointer;
            font-family: inherit;
            transition: border-color 0.15s;
            padding: 5px 8px;
        }
        #affine-a:focus, #affine-b:focus { border-color: var(--border-hi); }
        #affine-a option, #affine-b option { background: var(--bg-2); }

        .btn-send {
            padding: 8px 16px;
            background: var(--primary);
            color: #fff;
            font-size: 12px; font-weight: 600;
            border: none; border-radius: var(--radius-sm);
            cursor: pointer; transition: background 0.15s; flex-shrink: 0;
            font-family: var(--sans);
        }
        .btn-send:hover {
            background: var(--primary-hover);
        }

        /* Resizers */
        .resizer-x {
            width: 3px; background: var(--border);
            cursor: col-resize; flex-shrink: 0;
            transition: background 0.15s; z-index: 10;
        }
        .resizer-x:hover, .resizer-x.dragging { background: var(--border-hi); }

        .resizer-y {
            height: 3px; background: var(--border);
            cursor: row-resize; flex-shrink: 0;
            transition: background 0.15s; z-index: 10;
        }
        .resizer-y:hover, .resizer-y.dragging { background: var(--border-hi); }

        /* Encryption Panel */
        .enc-panel {
            flex: 1; display: flex; flex-direction: column;
            overflow: hidden; background: var(--bg-2);
        }
        .enc-panel-top {
            flex: 0 0 auto; height: 45%;
            min-height: 20%; max-height: 80%;
            padding: 14px 18px; overflow-y: auto; flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }
        .enc-panel-bottom {
            flex: 1; display: flex; flex-direction: column;
            padding: 14px 18px; overflow: hidden; min-height: 0;
            background: var(--bg);
        }

        .panel-hdr {
            display: flex; align-items: center; justify-content: space-between;
            font-family: var(--mono);
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.05em; text-transform: uppercase;
            margin-bottom: 12px;
            color: var(--text-dim);
        }
        .panel-hdr::after {
            content: '';
            flex: 1; height: 1px;
            background: var(--border);
            margin-left: 10px;
        }

        /* Messages */
        .message-row { display: flex; flex-direction: column; margin-bottom: 4px; }

        .msg-wrap {
            display: flex; align-items: flex-start; justify-content: space-between;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-2);
            transition: border-color 0.15s;
        }
        .msg-wrap:hover {
            border-color: var(--border-md);
        }
        .msg-text {
            flex: 1; font-size: 13px; line-height: 1.5;
            word-break: break-all;
        }
        .msg-system {
            color: var(--text-dim); font-style: italic;
            font-size: 12px; padding: 4px 8px;
            font-family: var(--mono);
            background: transparent; border-color: transparent;
        }
        .msg-actions {
            display: flex; gap: 4px; opacity: 0;
            transition: opacity 0.15s; min-width: 60px;
            justify-content: flex-end;
        }
        .msg-wrap:hover .msg-actions { opacity: 1; }

        .action-btn {
            background: transparent; border: none; cursor: pointer;
            color: var(--text-faint); padding: 3px;
            display: flex; align-items: center; transition: color 0.15s;
            border-radius: var(--radius-sm);
        }
        .action-btn:hover { color: var(--text-hi); background: rgba(255,255,255,0.06); }
        .btn-trash:hover { color: var(--rose); }
        .btn-inspect:hover { color: var(--blue-light); }

        .reactions-row {
            display: flex; gap: 4px; flex-wrap: wrap;
            padding-left: 4px; margin-top: 3px;
        }
        .reaction-badge {
            background: var(--bg-3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 2px 6px;
            font-size: 11px; cursor: pointer; color: var(--text-dim);
            display: flex; align-items: center; gap: 3px;
            user-select: none; transition: all 0.15s;
        }
        .reaction-badge:hover { border-color: var(--border-md); color: var(--text-hi); }
        .reaction-badge.active {
            background: rgba(37,99,235,0.15);
            border-color: var(--border-hi);
            color: var(--text-hi);
        }

        .emoji-picker-container {
            position: fixed; z-index: 1000; display: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-md); overflow: hidden;
        }

        /* Cipher parameter wrapper */
        .enc-param-wrapper {
            display: flex; flex-direction: column; gap: 10px;
            margin-bottom: 12px;
        }
        .enc-label {
            font-family: var(--sans);
            font-size: 11px; font-weight: 600;
            color: var(--text-dim);
        }

        .shift-row { display: flex; align-items: center; gap: 12px; }

        .shift-badge {
            width: 36px; height: 36px; border-radius: var(--radius-sm); flex-shrink: 0;
            background: var(--bg-3);
            border: 1px solid var(--border-md);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--mono); font-size: 15px; font-weight: 700;
            color: var(--text-hi);
        }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            border-radius: 50%; background: var(--primary);
            cursor: pointer; margin-top: -5px;
            border: 2px solid #fff;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 4px;
            background: var(--border-md);
            border-radius: 2px;
        }
        input[type=range]:focus { outline: none; }

        .alpha-strip {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
        }
        .alpha-label {
            font-family: var(--mono);
            font-size: 9px; font-weight: 600; letter-spacing: 0.05em;
            text-transform: uppercase; color: var(--text-faint); margin-bottom: 2px;
        }
        .alpha-letters {
            font-family: var(--mono); font-size: 13px; letter-spacing: 0.15em;
        }

        .hill-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .hill-size-pill {
            display: inline-flex; align-items: center;
            background: var(--bg-3);
            border: 1px solid var(--border-md);
            border-radius: var(--radius-sm); padding: 2px 8px;
            font-family: var(--mono); font-size: 11px; font-weight: 600;
            color: var(--text-hi);
        }
        #hill-grid-picker {
            display: grid; grid-template-columns: repeat(4,14px); gap: 3px;
            padding: 5px; background: var(--bg-3);
            border-radius: var(--radius-sm); border: 1px solid var(--border); cursor: pointer;
        }
        .grid-cell {
            width: 14px; height: 14px;
            border: 1px solid var(--border-md); border-radius: 2px;
            background: var(--bg-2); transition: background 0.1s; cursor: pointer;
        }
        #hill-matrix-container {
            display: grid; gap: 6px;
            background: var(--bg-3); padding: 10px;
            border-radius: var(--radius-sm); border: 1px solid var(--border);
        }
        .hill-cell {
            aspect-ratio: 1; width: 100%; max-width: 48px; text-align: center;
            font-family: var(--mono); font-size: 14px; font-weight: 600; padding: 0;
            border-radius: var(--radius-sm);
            background: var(--bg-2); border: 1px solid var(--border-md);
            color: var(--text-hi); outline: none;
        }
        .hill-cell:focus { border-color: var(--border-hi); }

        .matrix-valid {
            display: flex; align-items: center; gap: 7px;
            padding: 6px 10px; border-radius: var(--radius-sm);
            font-size: 11px; font-weight: 500; border: 1px solid var(--border);
            min-height: 28px;
            font-family: var(--mono);
        }
        .matrix-valid.valid   { background: rgba(46,160,67,0.1); border-color: rgba(46,160,67,0.3); color: var(--green-light); }
        .matrix-valid.invalid { background: var(--rose-dim); border-color: rgba(248,81,73,0.3); color: var(--rose); }
        .matrix-valid.pending { background: var(--bg-3); border-color: var(--border); color: var(--text-dim); }
        .valid-dot { width: 6px; height: 6px; border-radius: 1px; background: currentColor; flex-shrink: 0; }

        .key-input-wrap { position: relative; }
        .key-icon {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            color: var(--text-faint); pointer-events: none;
        }
        .key-inp {
            padding-left: 34px !important;
            font-family: var(--mono); font-size: 13px;
            text-transform: uppercase; letter-spacing: 0.15em;
        }
        .key-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .key-len {
            font-family: var(--mono); font-size: 10px; font-weight: 600;
            color: var(--text-faint);
        }
        .key-bars { display: flex; gap: 3px; }
        .key-bar {
            width: 10px; height: 3px; border-radius: 1px;
            background: var(--border-md);
        }
        .key-bar.filled { background: var(--primary); }
        .key-bar.filled.strong { background: var(--green); }

        /* Tabs */
        .tabs-wrap {
            display: flex; flex-direction: column;
            height: 100%; overflow: hidden; min-height: 0;
        }
        .tabs-nav {
            display: flex; border-bottom: 1px solid var(--border);
            flex-shrink: 0; margin-bottom: 8px;
        }
        .tab-btn {
            flex: 1; background: none; border: none;
            color: var(--text-dim); padding: 8px 6px;
            cursor: pointer; font-weight: 600;
            font-family: var(--sans);
            font-size: 12px;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
        }
        .tab-btn:hover { color: var(--text-hi); }
        .tab-btn.active {
            color: var(--text-hi);
            border-bottom-color: var(--primary);
        }
        .tab-pane {
            display: none; flex: 1; overflow-y: auto;
            min-height: 0; padding-bottom: 20px;
            font-size: 13px; color: var(--text-dim); line-height: 1.6;
        }
        .tab-pane.active { display: flex; flex-direction: column; }

        /* Solution / Guide (NO single-color side bars!) */
        .history-block { padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
        .sol-box {
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px; margin-bottom: 10px;
        }
        .sol-title {
            font-family: var(--sans);
            font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
            text-transform: uppercase; color: var(--text-dim);
            margin-bottom: 6px; border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
        .sol-explain {
            font-size: 12px; color: var(--text-dim); line-height: 1.6;
            padding: 8px 12px; background: var(--bg-3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
        }
        .sol-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
        .sol-table th {
            text-align: left; padding: 6px 8px;
            border-bottom: 1px solid var(--border); color: var(--text-faint);
            font-size: 9px; font-family: var(--mono); text-transform: uppercase;
        }
        .sol-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); color: var(--text); }
        .sol-table tr:last-child td { border-bottom: none; }
        .tscroll { max-height: 175px; overflow-y: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-3); }
        .hi-cell { color: var(--purple-light); font-weight: 600; }
        .enc-cell { color: var(--blue-light); font-weight: 600; }
        .op-cell { color: var(--text-faint); font-size: 10px; }

        .btn-full {
            width: 100%; padding: 8px 12px;
            background: var(--primary);
            color: #fff; border: none; border-radius: var(--radius-sm);
            font-size: 12px; font-weight: 600;
            cursor: pointer; transition: background 0.15s;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--sans);
        }
        .btn-full:hover { background: var(--primary-hover); }

        /* Decrypt mode toggle */
        .decrypt-mode-bar { display: flex; gap: 6px; flex-shrink: 0; margin-bottom: 12px; }
        .mode-btn {
            flex: 1; padding: 6px 10px;
            background: var(--bg-3); border: 1px solid var(--border);
            color: var(--text-dim); font-family: var(--sans);
            font-size: 12px; font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer; transition: all 0.15s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .mode-btn:hover { color: var(--text-hi); border-color: var(--border-md); }
        .mode-btn.active {
            background: var(--bg);
            border-color: var(--border-hi);
            color: var(--text-hi);
        }

        /* Algorithm terminal view */
        .algo-terminal, .manual-terminal {
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--mono); font-size: 12px; overflow: hidden;
        }
        .algo-header, .manual-header {
            background: var(--bg-3); padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 8px;
        }
        .algo-terminal-icon {
            display: flex; align-items: center; color: var(--text-faint);
        }
        .algo-title, .manual-title { color: var(--text-hi); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; flex: 1; }
        .algo-body, .manual-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .algo-pseudocode {
            background: var(--bg-2); border-radius: var(--radius-sm);
            padding: 10px 12px; border: 1px solid var(--border);
        }
        .algo-line { color: var(--text-dim); line-height: 1.8; font-size: 11px; }
        .algo-line .kw  { color: #a78bfa; font-weight: 600; }
        .algo-line .fn  { color: #60a5fa; }
        .algo-line .val { color: #34d399; }
        .algo-line .cm  { color: var(--text-faint); font-style: italic; }

        .scan-results { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
        .scan-row {
            display: flex; align-items: center; gap: 8px; padding: 4px 8px;
            border-radius: 2px; background: var(--bg-2);
            border: 1px solid var(--border); font-size: 11px;
        }
        .scan-match { background: rgba(37,99,235,0.15) !important; border-color: var(--border-hi) !important; }
        .scan-shift { color: var(--text-dim); width: 66px; flex-shrink: 0; font-family: var(--mono); }
        .scan-text { flex: 1; color: var(--text-hi); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 120px; }
        .scan-bar { color: var(--blue-light); width: 65px; flex-shrink: 0; font-size: 10px; }
        .scan-score { color: var(--text-faint); width: 22px; text-align: right; flex-shrink: 0; font-size: 10px; }
        .scan-tag { color: var(--green-light); font-weight: 700; font-size: 10px; flex-shrink: 0; }

        .algo-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .ctrl-btn {
            padding: 5px 12px;
            background: var(--bg-3);
            border: 1px solid var(--border-md);
            color: var(--text); font-size: 11px; font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer; font-family: var(--sans); transition: all 0.15s;
        }
        .ctrl-btn:hover { background: var(--border-md); color: var(--text-hi); }
        .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .algo-success {
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: var(--radius-sm); padding: 8px 12px;
            color: var(--green-light); font-size: 12px; line-height: 1.6;
        }
        .algo-step-block {
            background: var(--bg-2); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 8px 10px;
        }
        .algo-step-title { color: var(--text-dim); font-size: 10px; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 4px; }
        .algo-step-val { color: var(--text); line-height: 1.6; font-size: 11px; }
        .algo-step-active { border-color: var(--border-hi) !important; background: rgba(37,99,235,0.06) !important; }
        .algo-step-done { border-color: rgba(16,185,129,0.3) !important; }
        .algo-step-done .algo-step-title { color: var(--green-light); }

        .mat-disp {
            font-family: var(--mono); background: var(--bg-3);
            padding: 6px 10px; border-radius: var(--radius-sm); display: inline-block;
            line-height: 1.8; color: var(--text-hi); font-size: 11px;
            border: 1px solid var(--border);
        }

        /* Manual walkthrough */
        .step-box {
            background: var(--bg-2); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 12px; margin-bottom: 8px;
        }
        .step-title {
            color: var(--text-hi); font-weight: 600; font-size: 12px;
            margin-bottom: 6px;
        }
        .step-input {
            width: 60px; padding: 6px;
            background: var(--bg-3);
            border: 1px solid var(--border-md); color: var(--text-hi);
            font-family: var(--mono); font-size: 13px;
            border-radius: var(--radius-sm); text-align: center; outline: none;
            transition: border-color 0.15s;
        }
        .step-input:focus { border-color: var(--border-hi); }

        .check-btn {
            padding: 6px 12px;
            background: var(--primary);
            border: none;
            color: #fff; border-radius: var(--radius-sm); cursor: pointer;
            font-family: var(--sans); font-weight: 600;
            font-size: 12px; transition: background 0.15s;
        }
        .check-btn:hover { background: var(--primary-hover); }

        .fb-ok  { color: var(--green-light); font-size: 12px; font-weight: 500; margin-top: 4px; }
        .fb-err { color: var(--rose); font-size: 12px; font-weight: 500; margin-top: 4px; }

        .prompt-line { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .prompt-sym { color: var(--text-faint); font-family: var(--mono); }
        .prompt-input {
            flex: 1; background: var(--bg-3);
            border: 1px solid var(--border-md);
            border-radius: var(--radius-sm);
            color: var(--text-hi); font-family: var(--mono);
            font-size: 12px; padding: 4px 8px; outline: none;
            text-transform: uppercase; transition: border-color 0.15s;
        }
        .prompt-input:focus { border-color: var(--border-hi); }

        .brute-out {
            background: var(--bg-3); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 8px 12px; margin-top: 6px;
            font-family: var(--mono); font-size: 12px; color: var(--blue-light);
            min-height: 28px; word-break: break-all;
        }

        .calc-link {
            display: inline-flex; align-items: center; gap: 5px;
            margin-top: 6px; padding: 4px 8px;
            background: var(--bg-3);
            border: 1px solid var(--border-md);
            border-radius: var(--radius-sm); color: var(--text-dim);
            text-decoration: none; font-size: 11px; font-weight: 500;
            transition: color 0.15s;
        }
        .calc-link:hover { color: var(--text-hi); border-color: var(--border-hi); }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-content {
            background: var(--bg-2); border: 1px solid var(--border-md);
            border-radius: var(--radius-md);
            width: 90%; max-width: 580px; max-height: 85vh;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 16px 36px rgba(0,0,0,0.5);
        }
        .modal-header {
            padding: 12px 16px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-3);
        }
        .modal-header h3 {
            margin: 0; font-size: 13px; font-weight: 700;
            color: var(--text-hi); font-family: var(--sans);
        }
        .modal-body { padding: 16px; overflow-y: auto; flex: 1; }
        .close-btn {
            background: none; border: none; color: var(--text-dim);
            font-size: 16px; cursor: pointer; transition: color 0.15s;
            line-height: 1;
        }
        .close-btn:hover { color: var(--text-hi); }

        .anim-in { }
    </style>
</head>
<body>

    <nav class="topbar">
        <a href="/" class="topbar-logo">
            <span class="logo-mark">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="7" width="10" height="7" rx="1"/>
                    <path d="M5 7V5a3 3 0 016 0v2"/>
                    <circle cx="8" cy="10.5" r="1" fill="currentColor"/>
                </svg>
            </span>
            <span class="logo-text">Insightful Encryptions</span>
        </a>

        <div class="topbar-nav">
            {% if page == 'chat' %}
                <a href="/leave" class="btn-disconnect">Disconnect</a>
            {% else %}
                <a href="/"      class="topbar-link {{ 'active' if page == 'home' else '' }}">Home</a>
                <a href="/lab"   class="topbar-link {{ 'active' if page == 'lab' else '' }}">Lab</a>
                <a href="/local" class="topbar-link {{ 'active' if page == 'local' else '' }}">Online Room</a>
            {% endif %}
        </div>
    </nav>

    {% block content %}
    {% endblock %}

</body>
</html>

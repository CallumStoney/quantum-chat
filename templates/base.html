<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumChat - Cryptography Playground & Real-Time Chat</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            /* Bespoke charcoal-slate palette - authentic developer tool feel */
            --bg:           #14161b;
            --bg-2:         #1b1e25;
            --bg-3:         #232833;
            --bg-inset:     #0f1115;
            --bg-panel:     #1b1e25;
            --bg-hover:     #2b313e;

            --text:         #c5ccd8;
            --text-hi:      #f0f3f8;
            --text-dim:     #848e9f;
            --text-md:      #848e9f;
            --text-faint:   #535c6c;
            --text-lo:      #434a57;

            --primary:      #2563eb;
            --primary-hover:#1d4ed8;
            --blue:         #2563eb;
            --blue-light:   #3b82f6;

            --cyan:         #0ea5e9;
            --cyan-dim:     rgba(14, 165, 233, 0.15);

            --amber:        #d97706;
            --amber-dim:    rgba(217, 119, 6, 0.15);

            --rose:         #ef4444;
            --rose-dim:     rgba(239, 68, 68, 0.15);
            --red:          #dc2626;

            --green:        #16a34a;
            --green-light:  #22c55e;
            --jade:         #16a34a;
            --jade-dim:     rgba(22, 163, 74, 0.15);

            --purple:       #7c3aed;
            --purple-light: #a855f7;
            --violet:       #7c3aed;
            --violet-dim:   rgba(124, 58, 237, 0.15);

            --muted:        #64748b;
            --muted-2:      #94a3b8;

            --border:       #282d37;
            --border-md:    #394050;
            --border-hi:    #4a5568;

            --mono: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, "Liberation Mono", Menlo, monospace;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

            --radius-xs: 2px;
            --radius-sm: 3px;
            --radius-md: 4px;
            --radius-lg: 4px;
            --radius-xl: 4px;
            --rad-sm: 2px;
            --rad-md: 3px;
            --rad-lg: 4px;

            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
            --shadow-md: 0 3px 6px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 8px 16px rgba(0, 0, 0, 0.45);
        }

        html, body {
            margin: 0; padding: 0; height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 13px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #282d37; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #394050; }

        /* Topbar */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 200;
            height: 50px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
        }

        .topbar-logo {
            display: flex; align-items: center; gap: 9px;
            text-decoration: none;
            color: var(--text-hi);
        }

        .logo-mark {
            width: 24px; height: 24px;
            background: var(--bg-3);
            border: 1px solid var(--border-md);
            border-radius: var(--radius-xs);
            display: flex; align-items: center; justify-content: center;
            color: var(--blue-light);
            font-size: 13px;
        }

        .logo-text {
            font-size: 14px; font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-hi);
            font-family: var(--sans);
        }

        .logo-tag {
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-3);
            border: 1px solid var(--border);
            padding: 1px 6px;
            border-radius: var(--radius-xs);
        }

        .topbar-nav { display: flex; align-items: center; gap: 4px; }

        .topbar-link {
            padding: 5px 12px;
            border-radius: var(--radius-xs);
            font-size: 13px; font-weight: 500;
            color: var(--text-dim);
            text-decoration: none;
            border: 1px solid transparent;
            transition: color 0.15s, background 0.15s;
        }
        .topbar-link:hover {
            color: var(--text-hi);
            background: var(--bg-3);
        }
        .topbar-link.active {
            color: var(--text-hi);
            background: var(--bg-3);
            border-color: var(--border-md);
        }

        .btn-disconnect {
            padding: 6px 14px;
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.35);
            color: #ff7b72;
            font-size: 12px; font-weight: 600;
            border-radius: var(--radius-sm);
            text-decoration: none;
            transition: all 0.15s;
            font-family: var(--sans);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-disconnect:hover {
            background: rgba(248, 81, 73, 0.2);
            border-color: #f85149;
            color: #ffffff;
        }

        /* Buttons */
        .btn-primary, .btn-submit-primary, .lab-btn-encrypt, .btn-action-host, .btn-send, .btn-full, .check-btn {
            background: var(--primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: background 0.15s ease, transform 0.05s ease;
            font-family: var(--sans);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            line-height: 18px;
        }
        .btn-primary:hover, .btn-submit-primary:hover, .lab-btn-encrypt:hover, .btn-action-host:hover, .btn-send:hover, .check-btn:hover {
            background: var(--primary-hover);
            color: #ffffff;
        }
        .btn-primary:active, .btn-submit-primary:active, .lab-btn-encrypt:active, .btn-action-host:active, .btn-send:active, .check-btn:active {
            transform: translateY(1px);
        }
        .btn-primary:disabled, .btn-submit-primary:disabled, .lab-btn-encrypt:disabled, .btn-action-host:disabled, .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary, .lab-btn-swap, .btn-action-join {
            background: var(--bg-3);
            border: 1px solid var(--border-md);
            color: var(--text-hi);
            font-size: 12px;
            font-weight: 500;
            padding: 7px 14px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: var(--sans);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            line-height: 18px;
        }
        .btn-secondary:hover, .lab-btn-swap:hover, .btn-action-join:hover {
            background: var(--bg-hover);
            border-color: var(--border-hi);
            color: #ffffff;
        }
        .btn-secondary:disabled, .lab-btn-swap:disabled, .btn-action-join:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-brass-primary {
            background: var(--primary) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            color: #ffffff !important;
        }
        .btn-brass-primary:hover {
            background: var(--primary-hover) !important;
        }

        /* Tabs - authentic developer tab strip */
        .tabs-nav, .lab-tabs-nav {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 14px;
            gap: 2px;
            background: transparent;
            padding: 0;
            flex-shrink: 0;
        }
        .tab-btn, .lab-tab-btn {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-dim);
            padding: 8px 14px;
            cursor: pointer;
            font-weight: 500;
            font-size: 12px;
            border-radius: 0;
            transition: color 0.15s ease, border-color 0.15s ease;
            font-family: var(--sans);
            text-align: center;
        }
        .tab-btn:hover, .lab-tab-btn:hover {
            color: var(--text-hi);
        }
        .tab-btn.active, .lab-tab-btn.active {
            background: transparent;
            color: var(--text-hi);
            font-weight: 600;
            border-bottom-color: var(--primary);
            box-shadow: none;
        }

        /* Range slider */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
            height: 20px;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 4px;
            background: var(--border-md);
            border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--primary);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: -5px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }
        input[type=range]::-webkit-slider-thumb:hover {
            background: var(--primary-hover);
        }
        input[type=range]:focus { outline: none; }

        /* Chat Layout */
        .chat-page {
            height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden; padding-top: 52px;
        }

        .chat-topbar-ext {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-2);
            flex-shrink: 0;
        }

        .room-badge {
            display: flex; align-items: center; gap: 8px;
        }

        .room-code-display {
            font-family: var(--mono);
            font-size: 13px; font-weight: 700;
            color: var(--blue-light);
            letter-spacing: 0.12em;
            background: var(--bg-inset);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-md);
        }

        .btn-copy-room {
            background: var(--bg-3);
            border: 1px solid var(--border-md);
            color: var(--text-dim);
            cursor: pointer;
            padding: 5px 9px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-family: var(--sans);
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .btn-copy-room:hover {
            border-color: var(--border-hi);
            color: var(--text-hi);
        }

        .btn-close-guide:hover { color: var(--text-hi); }

        .chat-body {
            flex: 1; display: flex; min-height: 0; overflow: hidden;
        }

        /* Chat column */
        .chat-col {
            display: flex; flex-direction: column;
            width: 40%; min-width: 320px; max-width: 75%;
            overflow: hidden; flex-shrink: 0;
            background: var(--bg);
        }

        .room-quick-guide {
            background: var(--bg-2);
            border: 1px solid var(--border);
            margin: 10px 12px 0 12px;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px; color: var(--text-dim);
            line-height: 1.5; flex-shrink: 0;
        }

        .chat-log {
            flex: 1; overflow-y: auto;
            padding: 14px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .chat-send-row {
            padding: 12px 14px;
            border-top: 1px solid var(--border);
            display: flex; gap: 8px;
            flex-shrink: 0;
            background: var(--bg-2);
        }

        .chat-input {
            flex: 1; padding: 8px 12px;
            background: var(--bg-inset);
            border: 1px solid var(--border-md);
            color: var(--text-hi);
            font-size: 13px;
            border-radius: var(--radius-sm);
            font-family: var(--sans);
            outline: none; transition: border-color 0.15s;
        }
        .chat-input:focus {
            border-color: var(--blue-light);
        }
        .chat-input::placeholder { color: var(--text-faint); }

        #encryption-selector {
            padding: 8px 12px;
            background: var(--bg-inset);
            border: 1px solid var(--border-md);
            color: var(--text-hi);
            font-size: 13px;
            border-radius: var(--radius-sm);
            outline: none; cursor: pointer;
            font-family: var(--sans);
            transition: border-color 0.15s;
        }
        #encryption-selector:focus { border-color: var(--blue-light); }
        #encryption-selector option { background: var(--bg-2); }

        #host-force-cipher {
            padding: 7px 10px;
            background: var(--bg-inset);
            border: 1px solid var(--border-md);
            color: var(--text-hi);
            font-size: 12px;
            border-radius: var(--radius-sm);
            outline: none; cursor: pointer;
            transition: border-color 0.15s;
            font-family: inherit;
            flex: 1;
            min-width: 140px;
        }
        #host-force-cipher:focus { border-color: var(--blue-light); }
        #host-force-cipher option { background: var(--bg-2); }

        #affine-a, #affine-b {
            background: var(--bg-inset);
            border: 1px solid var(--border-md);
            color: var(--text-hi);
            font-size: 12px;
            border-radius: var(--radius-sm);
            outline: none; cursor: pointer;
            font-family: inherit;
            transition: border-color 0.15s;
            padding: 6px 10px;
        }
        #affine-a:focus, #affine-b:focus { border-color: var(--blue-light); }
        #affine-a option, #affine-b option { background: var(--bg-2); }

        /* Resizers */
        .resizer-x {
            width: 4px; background: var(--border);
            cursor: col-resize; flex-shrink: 0;
            transition: background 0.15s; z-index: 10;
        }
        .resizer-x:hover, .resizer-x.dragging { background: var(--blue-light); }

        .resizer-y {
            height: 4px; background: var(--border);
            cursor: row-resize; flex-shrink: 0;
            transition: background 0.15s; z-index: 10;
        }
        .resizer-y:hover, .resizer-y.dragging { background: var(--blue-light); }

        /* Encryption Panel */
        .enc-panel {
            flex: 1; display: flex; flex-direction: column;
            overflow: hidden; background: var(--bg-2);
        }
        .enc-panel-top {
            flex: 0 0 auto; height: 45%;
            min-height: 20%; max-height: 80%;
            padding: 16px 20px; overflow-y: auto; flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }
        .enc-panel-bottom {
            flex: 1; display: flex; flex-direction: column;
            padding: 16px 20px; overflow: hidden; min-height: 0;
            background: var(--bg);
        }

        .panel-hdr {
            display: flex; align-items: center; justify-content: space-between;
            font-family: var(--sans);
            font-size: 12px; font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-hi);
        }
        .panel-hdr::after {
            content: '';
            flex: 1; height: 1px;
            background: var(--border);
            margin-left: 10px;
        }

        /* Message Stream */
        .message-row { display: flex; flex-direction: column; margin-bottom: 4px; }

        .msg-wrap {
            display: flex; align-items: flex-start; justify-content: space-between;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-2);
            transition: border-color 0.15s;
        }
        .msg-wrap:hover {
            border-color: var(--border-md);
        }
        .msg-text {
            flex: 1; font-size: 13px; line-height: 1.5;
            word-break: break-all;
        }
        .msg-system {
            color: var(--text-dim); font-style: italic;
            font-size: 12px; padding: 4px 8px;
            font-family: var(--sans);
            background: transparent; border-color: transparent;
        }
        .msg-actions {
            display: flex; gap: 4px; opacity: 0;
            transition: opacity 0.15s; min-width: 60px;
            justify-content: flex-end;
        }
        .msg-wrap:hover .msg-actions { opacity: 1; }

        .action-btn {
            background: transparent; border: 1px solid transparent; cursor: pointer;
            color: var(--text-faint); padding: 4px 6px;
            display: flex; align-items: center; transition: all 0.15s;
            border-radius: var(--radius-xs);
        }
        .action-btn:hover { color: var(--text-hi); background: var(--bg-3); border-color: var(--border); }
        .btn-trash:hover { color: var(--rose); }
        .btn-inspect:hover { color: var(--blue-light); }

        .reactions-row {
            display: flex; gap: 4px; flex-wrap: wrap;
            padding-left: 4px; margin-top: 3px;
        }
        .reaction-badge {
            background: var(--bg-3);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs); padding: 2px 7px;
            font-size: 11px; cursor: pointer; color: var(--text-dim);
            display: flex; align-items: center; gap: 4px;
            user-select: none; transition: all 0.15s;
        }
        .reaction-badge:hover { border-color: var(--border-md); color: var(--text-hi); }
        .reaction-badge.active {
            background: rgba(31, 111, 235, 0.15);
            border-color: var(--blue);
            color: var(--text-hi);
        }

        .emoji-picker-container {
            position: fixed; z-index: 1000; display: none;
            box-shadow: var(--shadow-lg);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-md); overflow: hidden;
        }

        /* Cipher parameter wrapper */
        .enc-param-wrapper {
            display: flex; flex-direction: column; gap: 10px;
            margin-bottom: 14px;
        }
        .enc-label {
            font-family: var(--sans);
            font-size: 12px; font-weight: 600;
            color: var(--text-dim);
        }

        .shift-row { display: flex; align-items: center; gap: 12px; }

        .shift-badge {
            width: 38px; height: 38px; border-radius: var(--radius-sm); flex-shrink: 0;
            background: var(--bg-inset);
            border: 1px solid var(--border-md);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--mono); font-size: 14px; font-weight: 600;
            color: var(--blue-light);
        }

        .alpha-strip {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-inset);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 9px 14px;
        }
        .alpha-label {
            font-family: var(--sans);
            font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
            text-transform: uppercase; color: var(--text-faint); margin-bottom: 2px;
        }
        .alpha-letters {
            font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em;
        }

        .hill-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .hill-size-pill {
            display: inline-flex; align-items: center;
            background: var(--bg-inset);
            border: 1px solid var(--border-md);
            border-radius: var(--radius-xs); padding: 3px 8px;
            font-family: var(--mono); font-size: 11px; font-weight: 600;
            color: var(--text-hi);
        }
        #hill-grid-picker {
            display: grid; grid-template-columns: repeat(4, 15px); gap: 3px;
            padding: 6px; background: var(--bg-inset);
            border-radius: var(--radius-xs); border: 1px solid var(--border); cursor: pointer;
        }
        .grid-cell {
            width: 15px; height: 15px;
            border: 1px solid var(--border-md); border-radius: 2px;
            background: var(--bg-2); transition: background 0.1s; cursor: pointer;
        }
        #hill-matrix-container {
            display: grid; gap: 6px;
            background: var(--bg-inset); padding: 12px;
            border-radius: var(--radius-sm); border: 1px solid var(--border);
        }
        .hill-cell {
            aspect-ratio: 1; width: 100%; max-width: 48px; text-align: center;
            font-family: var(--mono); font-size: 14px; font-weight: 600; padding: 0;
            border-radius: var(--radius-xs);
            background: var(--bg-2); border: 1px solid var(--border-md);
            color: var(--text-hi); outline: none;
            transition: border-color 0.15s;
        }
        .hill-cell:focus { border-color: var(--blue-light); }

        .matrix-valid {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 12px; border-radius: var(--radius-xs);
            font-size: 12px; font-weight: 500; border: 1px solid var(--border);
            min-height: 28px;
            font-family: var(--sans);
        }
        .matrix-valid.valid   { background: rgba(46,160,67,0.1); border-color: rgba(46,160,67,0.3); color: var(--green-light); }
        .matrix-valid.invalid { background: var(--rose-dim); border-color: rgba(248,81,73,0.3); color: var(--rose); }
        .matrix-valid.pending { background: var(--bg-3); border-color: var(--border); color: var(--text-dim); }
        .valid-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

        .key-input-wrap { position: relative; }
        .key-icon {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            color: var(--text-faint); pointer-events: none;
        }
        .key-inp {
            padding-left: 34px !important;
            font-family: var(--mono); font-size: 13px;
            text-transform: uppercase; letter-spacing: 0.1em;
        }
        .key-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
        .key-len {
            font-family: var(--sans); font-size: 11px; font-weight: 500;
            color: var(--text-faint);
        }
        .key-bars { display: flex; gap: 4px; }
        .key-bar {
            width: 12px; height: 4px; border-radius: 2px;
            background: var(--border-md);
        }
        .key-bar.filled { background: var(--blue-light); }
        .key-bar.filled.strong { background: var(--green); }

        /* Tabs structure */
        .tabs-wrap {
            display: flex; flex-direction: column;
            height: 100%; overflow: hidden; min-height: 0;
        }
        .tab-pane {
            display: none; flex: 1; overflow-y: auto;
            min-height: 0; padding-bottom: 20px;
            font-size: 13px; color: var(--text-dim); line-height: 1.6;
        }
        .tab-pane.active { display: flex; flex-direction: column; }

        /* Guides & cards */
        .guide-placeholder-msg {
            display: block; text-align: center;
            color: var(--text-faint); font-style: italic;
            padding: 24px 16px; font-size: 13px; line-height: 1.6;
        }
        .history-block {
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-2);
            margin-bottom: 14px;
        }
        .cipher-spec-header {
            display: flex; flex-direction: column; gap: 4px;
            margin-bottom: 12px; padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .cipher-tag {
            font-family: var(--sans);
            font-size: 11px; font-weight: 600;
            color: var(--blue-light);
            text-transform: uppercase; letter-spacing: 0.04em;
        }
        .cipher-spec-title {
            margin: 0; font-size: 16px; font-weight: 700;
            color: var(--text-hi); font-family: var(--sans);
        }
        .cipher-spec-intro {
            margin: 0 0 14px 0; font-size: 13px; line-height: 1.6;
            color: var(--text);
        }
        .spec-section {
            margin-top: 12px; padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .spec-section-title {
            font-family: var(--sans);
            font-size: 11px; font-weight: 700;
            color: var(--text-dim); text-transform: uppercase;
            letter-spacing: 0.04em; margin-bottom: 8px;
        }
        .spec-math-formula {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg-inset);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 9px 14px; margin-bottom: 10px;
            font-family: var(--mono); font-size: 12px;
            color: var(--blue-light); overflow-x: auto;
        }
        .formula-arrow { color: var(--text-faint); font-size: 14px; }
        .spec-section-desc {
            margin: 0 0 8px 0; font-size: 12px; line-height: 1.6;
            color: var(--text-dim);
        }
        .spec-list {
            margin: 6px 0 10px 0; padding-left: 20px;
            color: var(--text-dim); font-size: 12px; line-height: 1.6;
        }
        .spec-list li { margin-bottom: 4px; }
        .spec-list strong { color: var(--text-hi); }

        .sol-box {
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px; margin-bottom: 12px;
        }
        .sol-title {
            font-family: var(--sans);
            font-size: 13px; font-weight: 600;
            color: var(--text-hi);
            margin-bottom: 8px; border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .sol-explain {
            font-size: 12px; color: var(--text-dim); line-height: 1.6;
            padding: 8px 12px; background: var(--bg-inset);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            margin-bottom: 10px;
        }
        .sol-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
        .sol-table th {
            text-align: left; padding: 7px 10px;
            border-bottom: 1px solid var(--border); color: var(--text-faint);
            font-size: 10px; font-family: var(--sans); font-weight: 600; text-transform: uppercase;
        }
        .sol-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text); }
        .sol-table tr:last-child td { border-bottom: none; }
        .tscroll { max-height: 180px; overflow-y: auto; border-radius: var(--radius-xs); border: 1px solid var(--border); background: var(--bg-inset); }
        .hi-cell { color: var(--purple-light); font-weight: 600; }
        .enc-cell { color: var(--blue-light); font-weight: 600; }
        .op-cell { color: var(--text-faint); font-size: 11px; }

        /* Decrypt mode toggle */
        .decrypt-mode-bar { display: flex; gap: 8px; flex-shrink: 0; margin-bottom: 12px; }
        .mode-btn {
            flex: 1; padding: 7px 12px;
            background: var(--bg-3); border: 1px solid var(--border);
            color: var(--text-dim); font-family: var(--sans);
            font-size: 12px; font-weight: 600;
            border-radius: var(--radius-xs);
            cursor: pointer; transition: all 0.15s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .mode-btn:hover { color: var(--text-hi); border-color: var(--border-md); }
        .mode-btn.active {
            background: var(--bg);
            border-color: var(--border-hi);
            color: var(--text-hi);
        }

        /* Algorithm terminal view */
        .algo-terminal, .manual-terminal {
            background: var(--bg-inset);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px; overflow: hidden;
        }
        .algo-header, .manual-header {
            background: var(--bg-3); padding: 9px 14px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 8px;
        }
        .algo-terminal-icon {
            display: flex; align-items: center; color: var(--blue-light);
        }
        .algo-title, .manual-title { color: var(--text-hi); font-size: 12px; font-weight: 600; flex: 1; font-family: var(--sans); }
        .algo-body, .manual-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
        .algo-pseudocode {
            background: var(--bg-2); border-radius: var(--radius-xs);
            padding: 10px 14px; border: 1px solid var(--border);
            font-family: var(--mono);
        }
        .algo-line { color: var(--text-dim); line-height: 1.8; font-size: 11px; }
        .algo-line .kw  { color: var(--purple-light); font-weight: 600; }
        .algo-line .fn  { color: var(--blue-light); }
        .algo-line .val { color: var(--green-light); }
        .algo-line .cm  { color: var(--text-faint); font-style: italic; }

        /* Notification Toast Container */
        .operator-notice-container {
            position: fixed; top: 62px; right: 20px; z-index: 1200;
            display: flex; flex-direction: column; gap: 8px; max-width: 380px;
            pointer-events: none;
        }
        .operator-notice {
            background: var(--bg-2);
            border: 1px solid var(--border-md);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            box-shadow: var(--shadow-md);
            display: flex; align-items: center; gap: 10px;
            font-size: 12px; color: var(--text); line-height: 1.5;
            pointer-events: auto;
            animation: notice-in 0.2s ease;
        }
        .operator-notice-warn { border-color: rgba(210, 153, 34, 0.4); }
        .operator-notice-err  { border-color: rgba(248, 81, 73, 0.4); }
        .operator-notice-ok   { border-color: rgba(46, 160, 67, 0.4); }
        .notice-icon { display: flex; align-items: center; flex-shrink: 0; }
        .operator-notice-warn .notice-icon { color: var(--amber); }
        .operator-notice-err  .notice-icon { color: var(--rose); }
        .operator-notice-ok   .notice-icon { color: var(--green-light); }
        .notice-msg { flex: 1; }
        @keyframes notice-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        .scan-results { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
        .scan-row {
            display: flex; align-items: center; gap: 8px; padding: 5px 10px;
            border-radius: var(--radius-xs); background: var(--bg-2);
            border: 1px solid var(--border); font-size: 11px;
            font-family: var(--mono);
        }
        .scan-match { background: rgba(31, 111, 235, 0.15) !important; border-color: var(--blue-light) !important; }
        .scan-shift { color: var(--text-dim); width: 66px; flex-shrink: 0; }
        .scan-text { flex: 1; color: var(--text-hi); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 120px; }
        .scan-bar { color: var(--blue-light); width: 65px; flex-shrink: 0; font-size: 10px; }
        .scan-score { color: var(--text-faint); width: 24px; text-align: right; flex-shrink: 0; font-size: 10px; }
        .scan-tag { color: var(--green-light); font-weight: 700; font-size: 11px; flex-shrink: 0; }

        .algo-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .ctrl-btn {
            padding: 6px 12px;
            background: var(--bg-3);
            border: 1px solid var(--border-md);
            color: var(--text); font-size: 12px; font-weight: 500;
            border-radius: var(--radius-xs);
            cursor: pointer; font-family: var(--sans); transition: all 0.15s;
        }
        .ctrl-btn:hover { background: #30363d; color: var(--text-hi); border-color: var(--border-hi); }
        .ctrl-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .algo-success {
            background: rgba(46, 160, 67, 0.1);
            border: 1px solid rgba(46, 160, 67, 0.3);
            border-radius: var(--radius-xs); padding: 10px 14px;
            color: var(--green-light); font-size: 12px; line-height: 1.6;
        }
        .algo-step-block {
            background: var(--bg-2); border: 1px solid var(--border);
            border-radius: var(--radius-xs); padding: 10px 12px;
        }
        .algo-step-title { color: var(--text-dim); font-size: 11px; font-weight: 600; margin-bottom: 4px; }
        .algo-step-val { color: var(--text); line-height: 1.6; font-size: 12px; }
        .algo-step-active { border-color: var(--blue-light) !important; background: rgba(31, 111, 235, 0.08) !important; }
        .algo-step-done { border-color: rgba(46, 160, 67, 0.3) !important; }
        .algo-step-done .algo-step-title { color: var(--green-light); }

        .mat-disp {
            font-family: var(--mono); background: var(--bg-inset);
            padding: 8px 12px; border-radius: var(--radius-xs); display: inline-block;
            line-height: 1.8; color: var(--text-hi); font-size: 12px;
            border: 1px solid var(--border);
        }

        /* Manual walkthrough */
        .step-box {
            background: var(--bg-2); border: 1px solid var(--border);
            border-radius: var(--radius-xs); padding: 12px; margin-bottom: 8px;
        }
        .step-title {
            color: var(--text-hi); font-weight: 600; font-size: 12px;
            margin-bottom: 6px;
        }
        .step-input {
            width: 65px; padding: 6px;
            background: var(--bg-inset);
            border: 1px solid var(--border-md); color: var(--text-hi);
            font-family: var(--mono); font-size: 13px;
            border-radius: var(--radius-xs); text-align: center; outline: none;
            transition: border-color 0.15s;
        }
        .step-input:focus { border-color: var(--blue-light); }

        .fb-ok  { color: var(--green-light); font-size: 12px; font-weight: 500; margin-top: 4px; }
        .fb-err { color: var(--rose); font-size: 12px; font-weight: 500; margin-top: 4px; }

        .prompt-line { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .prompt-sym { color: var(--text-faint); font-family: var(--mono); }
        .prompt-input {
            flex: 1; background: var(--bg-inset);
            border: 1px solid var(--border-md);
            border-radius: var(--radius-xs);
            color: var(--text-hi); font-family: var(--mono);
            font-size: 12px; padding: 5px 10px; outline: none;
            text-transform: uppercase; transition: border-color 0.15s;
        }
        .prompt-input:focus { border-color: var(--blue-light); }

        .brute-out {
            background: var(--bg-inset); border: 1px solid var(--border);
            border-radius: var(--radius-xs); padding: 8px 12px; margin-top: 6px;
            font-family: var(--mono); font-size: 12px; color: var(--blue-light);
            min-height: 28px; word-break: break-all;
        }

        .calc-link {
            display: inline-flex; align-items: center; gap: 5px;
            margin-top: 6px; padding: 4px 10px;
            background: var(--bg-3);
            border: 1px solid var(--border-md);
            border-radius: var(--radius-xs); color: var(--text-dim);
            text-decoration: none; font-size: 12px; font-weight: 500;
            transition: all 0.15s;
        }
        .calc-link:hover { color: var(--text-hi); border-color: var(--border-hi); }

        /* Modal Inspector */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.7); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-content {
            background: var(--bg-2); border: 1px solid var(--border-md);
            border-radius: var(--radius-md);
            width: 90%; max-width: 620px; max-height: 85vh;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: var(--shadow-lg);
        }
        .modal-header {
            padding: 14px 18px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-3);
        }
        .modal-header h3 {
            margin: 0; font-size: 14px; font-weight: 600;
            color: var(--text-hi); font-family: var(--sans);
        }
        .modal-body { padding: 18px; overflow-y: auto; flex: 1; }
        .close-btn {
            background: none; border: none; color: var(--text-dim);
            font-size: 18px; cursor: pointer; transition: color 0.15s;
            line-height: 1; padding: 0;
        }
        .close-btn:hover { color: var(--text-hi); }

        .anim-in { }
    </style>
</head>
<body>

    <nav class="topbar">
        <a href="/" class="topbar-logo">
            <span class="logo-mark">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </span>
            <span class="logo-text">QuantumChat</span>
            <span class="logo-tag">Playground</span>
        </a>

        <div class="topbar-nav">
            {% if page == 'chat' %}
                <a href="/leave" class="btn-disconnect">Leave Room</a>
            {% else %}
                <a href="/"      class="topbar-link {{ 'active' if page == 'home' else '' }}">Home</a>
                <a href="/lab"   class="topbar-link {{ 'active' if page == 'lab' else '' }}">Workbench</a>
                <a href="/local" class="topbar-link {{ 'active' if page == 'local' else '' }}">Chat Rooms</a>
            {% endif %}
        </div>
    </nav>

    <div id="operator-notice-container" class="operator-notice-container"></div>

    <script>
    function showOperatorNotice(msg, type = 'warn', duration = 3500) {
        const container = document.getElementById('operator-notice-container');
        if (!container) return;
        const notice = document.createElement('div');
        notice.className = `operator-notice operator-notice-${type}`;
        
        let iconSvg = '';
        if (type === 'err') {
            iconSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
        } else if (type === 'ok') {
            iconSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
        } else {
            iconSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
        }
        
        notice.innerHTML = `<span class="notice-icon">${iconSvg}</span><div class="notice-msg">${msg}</div>`;
        container.appendChild(notice);
        setTimeout(() => {
            notice.style.transition = 'opacity 0.2s, transform 0.2s';
            notice.style.opacity = '0';
            notice.style.transform = 'translateY(-6px)';
            setTimeout(() => notice.remove(), 200);
        }, duration);
    }
    window.showOperatorNotice = showOperatorNotice;
    </script>

    {% block content %}
    {% endblock %}

</body>
</html>

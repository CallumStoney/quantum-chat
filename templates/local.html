{% extends "base.html" %}

{% block content %}
<style>
    .lobby-wrapper {
        min-height: calc(100vh - 48px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        background: var(--bg);
    }

    .lobby-card {
        width: 100%;
        max-width: 480px;
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 28px 24px;
    }

    .lobby-header {
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
    }

    .lobby-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--text-hi);
        margin: 0 0 4px 0;
    }

    .lobby-desc {
        font-size: 12px;
        color: var(--text-dim);
        margin: 0;
        line-height: 1.5;
    }

    .field-group {
        margin-bottom: 18px;
    }

    .field-label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
    }

    .text-input {
        width: 100%;
        padding: 8px 12px;
        background: var(--bg-3);
        border: 1px solid var(--border-md);
        color: var(--text-hi);
        font-family: var(--sans);
        font-size: 13px;
        border-radius: var(--radius-sm);
        outline: none;
        transition: border-color 0.15s;
    }
    .text-input:focus {
        border-color: var(--border-hi);
    }
    .text-input::placeholder {
        color: var(--text-faint);
    }

    .code-input-field {
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-align: center;
        text-transform: uppercase;
    }

    .field-error {
        font-size: 11px;
        color: var(--rose);
        margin-top: 4px;
        min-height: 16px;
        display: block;
    }

    .action-section {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .btn-action-host {
        width: 100%;
        padding: 9px 16px;
        background: var(--primary);
        color: #fff;
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 600;
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: background 0.15s;
    }
    .btn-action-host:hover {
        background: var(--primary-hover);
    }
    .btn-action-host:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .divider-text {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 4px 0;
        color: var(--text-faint);
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }
    .divider-text::before,
    .divider-text::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    .join-group {
        display: flex;
        gap: 8px;
    }

    .join-group .text-input {
        flex: 1;
    }

    .btn-action-join {
        padding: 8px 16px;
        background: var(--bg-3);
        border: 1px solid var(--border-md);
        color: var(--text-hi);
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 600;
        border-radius: var(--radius-sm);
        cursor: pointer;
        white-space: nowrap;
        transition: border-color 0.15s, background 0.15s;
    }
    .btn-action-join:hover {
        border-color: var(--border-hi);
        background: var(--bg);
    }
    .btn-action-join:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .lobby-foot {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: var(--text-faint);
    }

    .lobby-foot a {
        color: var(--text-dim);
        text-decoration: none;
    }
    .lobby-foot a:hover {
        color: var(--text-hi);
    }
</style>

<div class="lobby-wrapper">
    <div class="lobby-card">
        <div class="lobby-header">
            <h2 class="lobby-title">Encrypted Room Lobby</h2>
            <p class="lobby-desc">
                Establish an isolated session or join an existing room with a 4-character code.
                All messages are encrypted client-side in browser memory.
            </p>
        </div>

        <form method="post" id="local-form">
            <div class="field-group">
                <label class="field-label" for="username_input">Display Alias</label>
                <input
                    type="text"
                    id="username_input"
                    name="username"
                    class="text-input"
                    placeholder="e.g. Alice"
                    maxlength="24"
                    required
                    autocomplete="off"
                >
                <span id="username_warning" class="field-error"></span>
            </div>

            <div class="action-section">
                <div>
                    <button type="submit" formaction="/host" id="btn-host" class="btn-action-host">
                        <svg viewBox="0 0 20 20" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
                            <rect x="2" y="2" width="16" height="7" rx="1"/>
                            <rect x="2" y="11" width="16" height="7" rx="1"/>
                            <circle cx="5.5" cy="5.5" r="1" fill="currentColor"/>
                            <circle cx="5.5" cy="14.5" r="1" fill="currentColor"/>
                        </svg>
                        Host New Session
                    </button>
                </div>

                <div class="divider-text">or join with code</div>

                <div class="field-group" style="margin-bottom:0">
                    <div class="join-group">
                        <input
                            type="text"
                            name="room_code"
                            id="room_code_box"
                            class="text-input code-input-field"
                            placeholder="ABCD"
                            maxlength="4"
                        >
                        <button type="submit" formaction="/join" id="btn-join" class="btn-action-join">
                            Join Session →
                        </button>
                    </div>
                </div>
            </div>
        </form>

        <div class="lobby-foot">
            <span>RAM ephemeral session</span>
            <a href="/">← Return to Hub</a>
        </div>
    </div>
</div>

<script>
const usernameInput = document.getElementById('username_input');
const warningDiv = document.getElementById('username_warning');
const hostBtn = document.getElementById('btn-host');
const joinBtn = document.getElementById('btn-join');

usernameInput.addEventListener('input', function () {
    const val = usernameInput.value.trim();
    if (!val) {
        warningDiv.textContent = '';
        hostBtn.disabled = joinBtn.disabled = false;
        usernameInput.style.borderColor = '';
        return;
    }
    fetch('/api/usernames')
        .then(r => r.json())
        .then(taken => {
            if (taken.includes(val)) {
                warningDiv.textContent = 'This alias is currently in use on the network.';
                hostBtn.disabled = joinBtn.disabled = true;
                usernameInput.style.borderColor = 'var(--rose)';
            } else {
                warningDiv.textContent = '';
                hostBtn.disabled = joinBtn.disabled = false;
                usernameInput.style.borderColor = '';
            }
        })
        .catch(() => {});
});

document.getElementById('local-form').addEventListener('submit', function (e) {
    if (!usernameInput.value.trim()) {
        e.preventDefault();
        usernameInput.focus();
    }
});
</script>
{% endblock %}

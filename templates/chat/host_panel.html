            {% if is_host %}
            <div class="host-panel"
                style="margin: 10px 10px 0; padding: 12px; background: var(--bg-2); border: 1px solid var(--border-md); border-radius: var(--radius-md); flex-shrink: 0;">
                
                <!-- Top Row: Title and Collapse Toggle -->
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 8px; gap: 8px;">
                    <div style="font-size: 11px; font-weight: 700; color: var(--amber); letter-spacing: 0.04em;">
                        Room Host Controls
                    </div>
                    <button id="host-controls-toggle" onclick="toggleHostControls()" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;padding:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center;transition:transform 0.15s;" title="Toggle controls">
                        ▼
                    </button>
                </div>

                <!-- Collapsible Content -->
                <div id="host-controls-content" style="display:block;overflow:hidden;">
                    <!-- Bold Message Toggle -->
                    <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; cursor: pointer;">
                        <input type="checkbox" id="host-bold"> Highlight my messages (bold)
                    </label>

                    <!-- Middle Row: Global Settings -->
                    <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px;">
                        <select id="host-force-cipher"
                            onchange="socket.emit('host_action', {room, action: 'force_cipher', cipher: this.value})">
                            <option value="">No Cipher Restriction (Free Choice)</option>
                            <option value="none">Lock Room to: Plaintext</option>
                            <option value="caesar">Lock Room to: Caesar</option>
                            <option value="affine">Lock Room to: Affine</option>
                            <option value="hill">Lock Room to: Hill</option>
                            <option value="vigenere">Lock Room to: Vigenère</option>
                            <option value="aes">Lock Room to: AES-256</option>
                            <option value="quantum">Lock Room to: BB84 Quantum</option>
                        </select>

                        <button class="ctrl-btn" style="border-color: var(--border-md); color: var(--text); flex-shrink: 0;"
                            onclick="socket.emit('host_action', {room, action: 'toggle_global_mute'})">Toggle Global Mute</button>
                    </div>

                    <!-- Bottom Row: User Management -->
                    <div style="display: flex; gap: 6px; align-items: center; background: var(--bg-3); padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); flex-wrap: wrap;">
                        <input type="text" id="host-target" class="chat-input" placeholder="User nickname"
                            style="flex: 1; min-width: 100px; padding: 6px 8px; font-size: 11px; border-radius: var(--radius-sm);">
                        <button class="ctrl-btn" style="flex-shrink: 0;"
                            onclick="socket.emit('host_action', {room, action: 'kick', target: document.getElementById('host-target').value})">Kick</button>
                        <button class="ctrl-btn" style="flex-shrink: 0;"
                            onclick="socket.emit('host_action', {room, action: 'toggle_user_mute', target: document.getElementById('host-target').value})">Mute/Unmute</button>
                        <input type="text" id="host-rename" class="chat-input" placeholder="New name"
                            style="flex: 1; min-width: 80px; padding: 6px 8px; font-size: 11px; border-radius: var(--radius-sm);">
                        <button class="ctrl-btn" style="flex-shrink: 0;"
                            onclick="socket.emit('host_action', {room, action: 'rename', target: document.getElementById('host-target').value, new_name: document.getElementById('host-rename').value})">Rename</button>
                    </div>
                </div>
            </div>
            {% endif %}

<div id="inspector-modal" class="modal-overlay" style="display:none;">

        <div class="modal-header">
            <h3 style="margin:0;font-size:13.5px;font-weight:700;color:var(--ink);font-family:var(--font-stamp);letter-spacing:0.04em;text-transform:uppercase;">Message Inspection Record</h3>
            <button class="close-btn"
                onclick="document.getElementById('inspector-modal').style.display='none'" title="Close">&times;</button>
        </div>
        <div class="modal-body" id="modal-body-content">
        </div>
    </div>
</div>
